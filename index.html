<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melon Restaurant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: white;
      color: black;
      margin: 0;
      text-align: center;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Qaranlıq rejim */
    body.dark-mode {
      background-color: #1a1a1a;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
    }

    /* Dil dəyişmə və qaranlıq rejim düymələri */
    .lang-btn, .dark-btn {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
    }

    .lang-btn {
      background: url('https://upload.wikimedia.org/wikipedia/commons/d/dd/Flag_of_Azerbaijan.svg') center/cover no-repeat;
      position: relative;
    }

    .lang-btn::after {
      content: '';
      position: absolute;
      bottom: -3px;
      right: -3px;
      width: 15px;
      height: 15px;
      background: url('https://upload.wikimedia.org/wikipedia/en/a/ae/Flag_of_the_United_Kingdom.svg') center/cover no-repeat;
      border-radius: 50%;
    }

    .dark-btn {
      background: url('https://upload.wikimedia.org/wikipedia/commons/8/8c/Circle-icons-sun.svg') center/cover no-repeat;
    }

    /* Loqo və ad */
    .logo-container {
      text-align: center;
      margin-top: 20px;
    }

    .logo-container img {
      width: 120px;
      height: auto;
      border-radius: 50%;
    }

    .restaurant-name {
      font-size: 20px;
      font-weight: bold;
      color: black;
      margin-top: 10px;
    }

    hr {
      width: 80%;
      margin: 20px auto;
      border: none;
      border-top: 1px solid black;
    }

    /* Menyu düyməsi */
    .menu-button {
      display: inline-block;
      background-color: #ffb347;
      padding: 12px 30px;
      border-radius: 15px;
      font-weight: bold;
      font-size: 16px;
      color: black;
      text-decoration: none;
      margin-bottom: 25px;
    }

    .menu-button:hover {
      background-color: #ff9900;
    }

    /* İş saatları */
    .info-box {
      background-color: #ccffcc;
      width: 80%;
      margin: 20px auto;
      border-radius: 15px;
      padding: 15px;
      text-align: left;
      line-height: 1.6;
    }

    /* Əlaqə bölməsi */
    .contact-box {
      background-color: #ccffcc;
      width: 80%;
      margin: 20px auto;
      border-radius: 15px;
      padding: 15px;
      text-align: left;
      line-height: 1.6;
    }

    .contact-box a {
      text-decoration: none;
      color: black;
      font-weight: bold;
    }

    /* TikTok düyməsi */
    .tiktok-btn {
      display: inline-block;
      margin-top: 10px;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: #fff url('https://upload.wikimedia.org/wikipedia/en/a/a9/TikTok_logo.svg') center/contain no-repeat;
      background-size: 70%;
    }

    /* Alt hissə */
    footer {
      margin-top: 30px;
      font-size: 14px;
      padding: 20px;
      background-color: #f5f5f5;
      border-top: 1px solid #ccc;
    }
  </style>
</head>
